<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Spotify Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 p-6">
        <h1 class="text-2xl font-bold mb-8">Spotify</h1>
        <nav class="space-y-4">
            <a href="index.html" class="flex items-center gap-3 text-gray-400 hover:text-white">
                <span>🏠</span> Home
            </a>
            <a href="search.html" class="flex items-center gap-3 text-gray-400 hover:text-white">
                <span>🔍</span> Search
            </a>
            <a href="library.html" class="flex items-center gap-3 text-white font-semibold">
                <span>📚</span> Library
            </a>
            <a href="playlist.html" class="flex items-center gap-3 text-gray-400 hover:text-white">
                <span>🎵</span> Playlist
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 bg-gradient-to-b from-gray-800 to-black">
        <h2 class="text-3xl font-bold mb-6">Your Library</h2>
        
        <!-- Library Items -->
        <div class="space-y-3">
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=64&h=64&fit=crop" alt="Playlist" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Liked Songs</h3>
                    <p class="text-sm text-gray-400">Playlist • 142 songs</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?w=64&h=64&fit=crop" alt="Playlist" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Daily Mix 1</h3>
                    <p class="text-sm text-gray-400">Playlist • By Spotify</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1487180144351-b8472da7d491?w=64&h=64&fit=crop" alt="Playlist" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Discover Weekly</h3>
                    <p class="text-sm text-gray-400">Playlist • By Spotify</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=64&h=64&fit=crop" alt="Playlist" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Release Radar</h3>
                    <p class="text-sm text-gray-400">Playlist • By Spotify</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1415886541506-6efc5e4b1786?w=64&h=64&fit=crop" alt="Album" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Midnight Memories</h3>
                    <p class="text-sm text-gray-400">Album • Various Artists</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
                <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=64&h=64&fit=crop" alt="Album" class="w-16 h-16 rounded">
                <div>
                    <h3 class="font-bold">Jazz Classics</h3>
                    <p class="text-sm text-gray-400">Album • Miles Davis</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
